sonar.projectKey=nas-wizard
sonar.projectName=Nas Wizard
sonar.projectVersion=0.9.0

sonar.sources=src,backend/axum/src
sonar.tests=src/tests,backend/axum/tests
sonar.exclusions=src/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,**/.features-gen/**,src/i18n/it.ts,src/i18n/en.ts

sonar.sourceEncoding=UTF-8

# Frontend coverage report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.spec.ts,**/*.d.ts

# Backend coverage report.
sonar.rust.lcov.reportPaths=backend/coverage/lcov.info
sonar.rust.clippy.reportPaths=backend/clippy-report.json
